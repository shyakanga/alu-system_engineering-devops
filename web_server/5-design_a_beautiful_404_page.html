<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 · ceci n'est pas une page</title>
<style>
:root{--bg:#0d1117;--fg:#e6edf3;--ln:#1f6feb;--ac:#58a6ff;--cd:#161b22}
:root.l{--bg:#fff;--fg:#1f2328;--ln:#0969da;--ac:#0969da;--cd:#f6f8fa}
*{box-sizing:border-box;margin:0;transition:background-color .4s,color .4s,border-color .4s,stroke .4s}
html{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);touch-action:none}
h1{position:fixed;inset:0;display:grid;place-items:center;padding:5vw;text-align:center;font:400 clamp(40px,10vw,150px)/1.15 "Segoe Script","Bradley Hand","Snell Roundhand","Lucida Handwriting","Comic Sans MS",cursive;opacity:.15;pointer-events:none;user-select:none}
svg{position:fixed;inset:0;width:100%;height:100%;fill:none;stroke:var(--ln);stroke-width:2;stroke-opacity:.7}
circle{fill:var(--bg)}
#s,#b{position:fixed;border:2px solid var(--ac);border-radius:8px;background:var(--cd)}
#s{left:50%;top:50%;translate:-50% -50%;width:calc(var(--g)*5);height:calc(var(--g)*.75);display:grid;place-items:center;color:var(--ac);font:600 calc(var(--g)*.33)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
#b{left:0;top:0;transform:translate(-50%,-50%);padding:10px 18px;color:var(--fg);font:600 15px/1 system-ui,sans-serif;white-space:nowrap;cursor:pointer}
#b.s{padding:5px 10px;color:var(--ac);font:600 12px/1 ui-monospace,Menlo,Consolas,monospace}
</style>

<h1>ceci n'est pas une page</h1>
<svg></svg>
<div id=s>00.00.00.00</div><!-- put your server's public IP in the box above -->
<button id=b>Get into server</button>

<script>
const $=q=>document.querySelector(q),b=$('#b'),S=$('#s'),V=$('svg'),D=document.documentElement,
DX=[1,0,-1,0],DY=[0,1,0,-1],M=100,rnd=n=>Math.random()*n|0;
let W,H,g,C,R,ic,jc,lo,jo,adj,sr,ux,uy,vx,vy,dir,tx,ty,ssh,cx=-999,cy=-999,cv=0,ct=0,last=0,rt;
const X=u=>W/2+(u-ic)*g,Y=u=>H/2+(u-jc)*g;

// Lattice: nodes (i,j) on a grid; adj[] holds a bitmask of edges per node (bit d: 0=+x 1=+y 2=-x 3=-y).
// Traces are random orthogonal walks. Whenever one reaches the screen border, it continues from
// the opposite border, so a chip that leaves one side always finds a line on the other.
function build(){
  W=innerWidth;H=innerHeight;g=W<600?36:48;D.style.setProperty('--g',g+'px');
  ic=Math.ceil((W/2+M)/g);C=2*ic;jc=Math.ceil((H/2+M)/g);R=2*jc;
  lo=Math.floor(ic-(W/2+40)/g);jo=Math.floor(jc-(H/2+40)/g); // border nodes: first ones just past the screen edge
  adj=new Uint8Array((C+1)*(R+1));
  const nodes=[],paths=[],pads=[],Q=[],r=14,out=(x,y)=>X(x)<0||X(x)>W||Y(y)<0||Y(y)>H;
  const walk=(x,y,d,n)=>{
    const p=[[x,y]];
    while(n--){
      for(let L=2+rnd(7);L-->0||out(x,y);){ // offscreen: keep going straight, never turn out of sight
        const nx=x+DX[d],ny=y+DY[d];
        adj[y*(C+1)+x]|=1<<d;adj[ny*(C+1)+nx]|=1<<(d^2);
        x=nx;y=ny;
        if(d%2?(y<=jo||y>=R-jo):(x<=lo||x>=C-lo)){
          p.push([x,y]);paths.push(p);
          if(paths.length<300)Q.push(d%2?[x,y<=jo?R-jo:jo,d]:[x<=lo?C-lo:lo,y,d]);
          return
        }
        out(x,y)||nodes.push([x,y])
      }
      p.push([x,y]);d=(d+1+2*rnd(2))%4
    }
    paths.push(p);pads.push([x,y])
  };
  const run=()=>{for(let a;a=Q.pop();)walk(a[0],a[1],a[2],3+rnd(4))};
  for(const k of[-2,0,2])Q.push([ic+k,jc,3]);   // traces leaving the server upwards
  for(const k of[-1,0,1])Q.push([ic+k,jc,1]);   // ...and downwards
  run();
  for(let i=(C+R)>>2;i--;){const a=nodes[rnd(nodes.length)];walk(a[0],a[1],rnd(4),3+rnd(4));run()}
  // draw: straight runs with rounded corners
  const pt=q=>[X(q[0]),Y(q[1])],
  dd=p=>{p=p.map(pt);let s='M'+p[0];
    for(let k=1;k<p.length-1;k++){const[A,B,E]=[p[k-1],p[k],p[k+1]];
      s+=`L${B.map((t,n)=>t-Math.sign(t-A[n])*r)}Q${B} ${B.map((t,n)=>t+Math.sign(E[n]-t)*r)}`}
    return s+'L'+p[p.length-1]};
  V.innerHTML=`<path d="${paths.map(dd).join('')}"/>`+pads.map(q=>`<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="4"/>`).join('');
  sr=S.getBoundingClientRect()
}

// back to a fresh "Get into server" button, top right
function home(){
  ssh=0;b.className='';b.textContent='Get into server';
  ux=(W/2-24-b.offsetWidth/2)/g+ic;uy=(24+b.offsetHeight/2-H/2)/g+jc;vx=vy=0
}

// free button touches a line -> collapse into the SSH chip and start sliding along it
function snag(f,ax,ay){
  const i=Math.floor(ux),j=Math.floor(uy),ir=Math.round(ux),jr=Math.round(uy),e=7/g,
  h=Math.abs(uy-jr)<e&&adj[jr*(C+1)+i]&1,v=Math.abs(ux-ir)<e&&adj[j*(C+1)+ir]&2;
  if(!h&&!v)return;
  if(h){dir=(f?ax>0:rnd(2))?0:2;uy=jr;tx=dir?i:i+1;ty=jr}
  else{dir=(f?ay>0:rnd(2))?1:3;ux=ir;tx=ir;ty=dir>1?j:j+1}
  ssh=1;vx=vy=0;b.className='s';b.textContent='* SSH';return 1
}

// chip reached a node: wrap around the screen if leaving it, then pick the next line (random, biased away from the cursor)
function arrive(){
  ux=tx;uy=ty;
  if(dir==0&&tx>=C-lo)ux=tx=lo;
  if(dir==2&&tx<=lo)ux=tx=C-lo;
  if(dir==1&&ty>=R-jo)uy=ty=jo;
  if(dir==3&&ty<=jo)uy=ty=R-jo;
  const m=adj[ty*(C+1)+tx],px=X(ux)-cx,py=Y(uy)-cy,n=Math.hypot(px,py)||1,f=n<160;
  let bs=-9,bd=dir^2;
  for(let k=0;k<4;k++)if((m>>k&1)&&k!=(dir^2)){const s=Math.random()+(f?(DX[k]*px+DY[k]*py)/n*2:0);if(s>bs){bs=s;bd=k}}
  dir=bd;tx+=DX[dir];ty+=DY[dir]
}

function slide(dt,sp){
  for(let s=sp*dt/g,r;s>0;){
    r=(tx-ux)*DX[dir]+(ty-uy)*DY[dir];
    if(s<r){ux+=DX[dir]*s;uy+=DY[dir]*s;return}
    s-=r;arrive()
  }
}

function tick(t){
  const dt=Math.min((t-last)/1e3,.05);last=t;cv*=Math.exp(-8*dt);
  const r=b.getBoundingClientRect(),
  d=Math.hypot(Math.max(r.left-cx,0,cx-r.right),Math.max(r.top-cy,0,cy-r.bottom)), // cursor -> button edge
  mx=(r.left+r.right)/2-cx,my=(r.top+r.bottom)/2-cy,a=Math.atan2(my||Math.random()-.5,mx),ax=Math.cos(a),ay=Math.sin(a);
  if(!ssh){
    // ~5px away (a bit more if the mouse is fast): shoot away from the cursor, then coast
    if(d<5+Math.min(cv*.05,60)){vx=ax*800;vy=ay*800}
    const k=Math.ceil(Math.hypot(vx,vy)*dt/5);
    for(let i=0;i<k;i++){
      ux=(ux+vx*dt/k/g+C)%C;uy=(uy+vy*dt/k/g+R)%R;
      if(snag(d<300,ax,ay))break
    }
    const fr=Math.exp(-4*dt);vx*=fr;vy*=fr
  }else{
    const px=X(ux)-cx,py=Y(uy)-cy,n=Math.hypot(px,py)||1;
    if(n<100&&px*DX[dir]+py*DY[dir]<0){tx-=DX[dir];ty-=DY[dir];dir^=2} // cursor ahead: turn around
    slide(dt,150+(n<140?400*(1-n/140):0));
    if(r.left<sr.right&&r.right>sr.left&&r.top<sr.bottom&&r.bottom>sr.top){D.classList.toggle('l');home()} // chip hit the server
  }
  b.style.translate=`${X(ux)}px ${Y(uy)}px`;
  requestAnimationFrame(tick)
}

onpointermove=onpointerdown=e=>{cv=Math.min(Math.hypot(e.clientX-cx,e.clientY-cy)/Math.max(e.timeStamp-ct,1)*1e3,1500);cx=e.clientX;cy=e.clientY;ct=e.timeStamp};
D.onpointerleave=()=>cx=cy=-999;
onresize=()=>{clearTimeout(rt);rt=setTimeout(()=>{build();home()},150)};
build();home();requestAnimationFrame(tick);
</script>
